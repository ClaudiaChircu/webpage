           <div style=" background:  #AEE4B8; padding: 30px; min-height: 100vh; margin: 0;">
  <h3 style="color: #352D39; margin-top: 0; font-size: 22px;">Send a Message</h3>
  
  <form action="https://formspree.io/f/mojbkvnw" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #352D39;">Name</label>
      <input type="text" name="name" required style="width: 100%; padding: 10px; border: 1px solid #AEE4B8; border-radius: 8px; box-sizing: border-box;">
    </div>
    
    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #352D39;">Email</label>
      <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #AEE4B8; border-radius: 8px; box-sizing: border-box;">
    </div>
    
    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #352D39;">Message</label>
      <textarea name="message" rows="5" required style="width: 100%; padding: 10px; border: 1px solid #AEE4B8; border-radius: 8px; box-sizing: border-box; resize: vertical;"></textarea>
    </div>
    
    <button type="submit" style="background: #352D39;  font-family: 'Macondo', cursive;color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s;">
      Send Message
    </button>
  </form>
</div>
